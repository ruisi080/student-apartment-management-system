server:
  port: 8080

spring:
  application:
    name: student-management

  # MySQL 数据库
  datasource:
    url: jdbc:mysql://localhost:3306/studentdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库凭据通过环境变量注入,避免提交到公开仓库
    # 本地运行:设置环境变量 DB_USERNAME / DB_PASSWORD(例如 export DB_PASSWORD=你的密码)
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 日志
logging:
  level:
    com.studentdb: DEBUG
